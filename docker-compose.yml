# Development: `docker compose up -d db redis` lalu `npm run dev`.
# Production (VPS): `docker compose --profile prod up -d --build`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance}
      POSTGRES_DB: insurance
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    profiles: ["prod"]
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://insurance:${POSTGRES_PASSWORD:-insurance}@db:5432/insurance
    depends_on:
      db: { condition: service_healthy }

  app:
    profiles: ["prod"]
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://insurance:${POSTGRES_PASSWORD:-insurance}@db:5432/insurance
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage # file upload; ikut di-backup
    ports:
      - "127.0.0.1:3000:3000" # Nginx di host meneruskan insurance.ide.asia → :3000
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
  storage:
